syntax = "proto3";

package aegs.clover.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// 衛星。
message Satellite {
  // 衛星の ID
  int64 id = 1;
  // 衛星の名前
  string name = 2;
}

// 登録された TLE の情報。
message TLERecord {
  // TLE の ID
  int64 id = 1;
  // 登録された TLE
  TLE tle = 2;
  // TLE の登録日時
  google.protobuf.Timestamp register_time = 3;
}

// TLE (Two-Line Elements)。
message TLE {
  // TLE の1行目
  string line1 = 1;
  // TLE の2行目
  string line2 = 2;
}

// 登録された OMM の情報。
message OMMRecord {
  // OMM の ID
  int64 id = 1;
  // 登録された OMM
  oneof omm {
    // 登録された OMM（KVN形式）
    string kvn = 2;
    // 登録された OMM（構造化フィールド形式）
    OMMElements elements = 4;
  }
  // OMM の登録日時
  google.protobuf.Timestamp register_time = 3;
}

// 構造化フィールドで表現した OMM (CCSDS Orbit Mean-Elements Message)。
message OMMElements {
  // OMM のメタデータ
  OMMMetadata metadata = 1;
  // 平均軌道要素
  OMMMeanElements mean_elements = 2;
  // TLE 由来のパラメータ
  OMMTleParameters tle_parameters = 3;
}

// OMM のメタデータ。
message OMMMetadata {
  // オブジェクト名 NORAD カタログ登録前には値がない
  optional string object_name = 1;
  // オブジェクト ID NORAD カタログ登録前には値がない
  optional string object_id = 2;
  // 基準座標系の中心
  string center_name = 3;
  // 基準座標系
  string ref_frame = 4;
  // 時刻系 UTC のみを受け付ける
  string time_system = 5;
  // 平均軌道要素のモデル
  string mean_element_theory = 6;
}

// OMM の平均軌道要素。
message OMMMeanElements {
  // 軌道要素の基準時刻 (UTC)
  google.protobuf.Timestamp epoch = 1;
  // 平均運動 [rev/day]
  double mean_motion = 2;
  // 離心率
  double eccentricity = 3;
  // 軌道傾斜角 [deg]
  double inclination = 4;
  // 昇交点赤経 [deg]
  double ra_of_asc_node = 5;
  // 近地点引数 [deg]
  double arg_of_pericenter = 6;
  // 平均近点角 [deg]
  double mean_anomaly = 7;
}

// TLE 由来の OMM パラメータ。
message OMMTleParameters {
  // 出力用の力学モデル番号
  uint32 ephemeris_type = 1;
  // 分類 NORAD カタログ登録前には値がない
  optional string classification_type = 2;
  // NORAD カタログ番号 NORAD カタログ登録前には値がない
  optional uint32 norad_cat_id = 3;
  // 要素セット番号 NORAD カタログ登録前には値がない
  optional uint32 element_set_no = 4;
  // 基準時刻でのレボリューション数 NORAD カタログ登録前には値がない
  optional uint32 rev_at_epoch = 5;
  // 抵抗項
  double bstar = 6;
  // 平均運動の1次微分
  double mean_motion_dot = 7;
  // 平均運動の2次微分
  double mean_motion_ddot = 8;
}

// OMM のフォーマット。
enum OMMFormat {
  // OMM のフォーマットが指定されていない場合の値。
  // リクエストでこの値が指定された場合は、INVALID_ARGUMENT エラーを返す。
  OMM_FORMAT_UNSPECIFIED = 0;

  // OMM のフォーマットが KVN 形式の場合の値
  OMM_FORMAT_KVN = 1;

  // OMM のフォーマットが構造化フィールド形式の場合の値
  OMM_FORMAT_ELEMENTS = 2;
}

// 地上局。
message GroundStation {
  // 地上局の ID
  int64 id = 1;
  // 地上局の名前
  string name = 2;
  // 地上局の位置
  LatLngAlt location = 3;
}

// 緯度・経度・高度からなる位置情報。
// パスの計算に使用される。
message LatLngAlt {
  // 緯度 [deg]
  double latitude = 1;
  // 経度 [deg]
  double longitude = 2;
  // 楕円体高 [meter]
  double altitude = 3;
}

// 衛星パス。
message Pass {
  // 当該パスの衛星
  Satellite satellite = 1;
  // 当該パスの地上局
  GroundStation ground_station = 2;
  // 当該パスの AOS/LOS と最大仰角
  PassDetails details = 3;
  // 当該パスがコンタクトとして予約可能かどうか
  bool is_available = 4;
}

// パスの AOS/LOS 時刻と最大仰角といった詳細情報。
message PassDetails {
  // AOS (Acquisition of Signal) 時刻
  google.protobuf.Timestamp aos = 1;
  // LOS (Loss of Signal) 時刻
  google.protobuf.Timestamp los = 2;
  // 最大仰角 [deg]
  double max_elevation = 3;
}

// コンタクト。
// Clover においては、予約されたパスを表す。
message Contact {
  // コンタクトの ID
  int64 id = 1;
  // コンタクト対象の衛星の ID
  int64 satellite_id = 2;
  // コンタクトで使用する地上局の ID
  int64 ground_station_id = 3;
  // コンタクトのステータス
  Status status = 4;
  // コンタクトの開始時刻。
  // AOSに対してバッファを持たせた時刻が設定され、この時刻をもとに予約の排他制御が行われる
  google.protobuf.Timestamp start_time = 5;
  // コンタクトの終了時刻。
  // LOSに対してバッファを持たせた時刻が設定され、この時刻をもとに予約の排他制御が行われる
  google.protobuf.Timestamp end_time = 6;
  // コンタクトの作成日時
  google.protobuf.Timestamp create_time = 7;
  // コンタクトの更新日時。
  // 基本的にはステータスの変更時刻を表す
  google.protobuf.Timestamp update_time = 8;
  // リクエスト時の軌道情報に基づいて計算されたパスの詳細。
  // GetContact の場合にのみ値が設定される。
  // コンタクト時刻の前後にパスが見つからなかった場合は値が設定されない
  PassDetails pass = 9;

  // コンタクトの状態。
  enum Status {
    // ステータスの値が設定されていない場合の値。
    // この値が設定された場合は異常な状態であるため、アークエッジ・スペースの担当者に連絡すること
    STATUS_UNSPECIFIED = 0;

    // 局管理者の確認待ちの状態。
    // コンタクトを予約した直後の初期状態。
    // この状態から他の状態に遷移したあと、この状態に戻ることはない
    STATUS_PENDING = 1;

    // 局管理者に承認され、コンタクトの予約が有効な状態
    STATUS_SCHEDULED = 2;

    // 局管理者に拒否され、コンタクトの予約が無効な状態
    // 他の状態に遷移しない終端状態
    STATUS_REJECTED = 3;

    // ユーザがコンタクトの予約をキャンセルした状態。
    // 他の状態に遷移しない終端状態
    STATUS_CANCELED = 4;

    // コンタクトが実行中の状態。
    // この状態になると、キャンセルできなくなる
    STATUS_RUNNING = 5;

    // コンタクトが完了した状態。
    // 他の状態に遷移しない終端状態
    STATUS_COMPLETED = 6;

    // コンタクトが何らかの理由で失敗した状態。
    // 他の状態に遷移しない終端状態
    STATUS_FAILED = 7;
  }
}

// コンタクトの件数・合計時間の統計情報。
message ContactStats {
  // コンタクトの件数
  int64 contact_count = 1;
  // コンタクトの合計時間
  google.protobuf.Duration total_contact_duration = 2;
}

// 衛星ごとのコンタクトの統計情報。
message SatelliteStats {
  // 統計対象の衛星の ID
  int64 satellite_id = 1;
  // 統計情報
  ContactStats stats = 2;
}

// 地上局ごとのコンタクトの統計情報。
message GroundStationStats {
  // 統計対象の地上局の ID
  int64 ground_station_id = 1;
  // 統計情報
  ContactStats stats = 2;
}

// URL からダウンロード可能なファイル。
message BlobFile {
  // ファイルをダウンロードするための URL
  string url = 1;
  // ファイル名
  string filename = 2;
  // ファイルのサイズ [byte]
  int64 size = 3;
}
